name: Build BLDC APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/bldcremote
          mkdir -p app/src/main/res/layout
          echo "include ':app'" > settings.gradle
          cat > app/build.gradle <<'G'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android { namespace 'com.bldcremote'; compileSdk 34; defaultConfig { applicationId "com.bldcremote"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" } }
          dependencies { implementation "androidx.core:core-ktx:1.12.0"; implementation "androidx.appcompat:appcompat:1.6.1" }
          G
          cat > build.gradle <<'G'
          buildscript{dependencies{classpath 'com.android.tools.build:gradle:8.2.0'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'}}
          G
          cat > app/src/main/AndroidManifest.xml <<'M'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.TRANSMIT_IR" android:required="false"/><application android:label="BLDC Remote" android:theme="@android:style/Theme.Black.NoTitleBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          M
          cat > app/src/main/res/layout/activity_main.xml <<'L'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:layout_width="match_parent" android:layout_height="match_parent" android:padding="20dp" android:background="#000000"><TextView android:text="BLDC Remote No Ads" android:textColor="#FFFFFF" android:gravity="center" android:textSize="20sp" android:layout_width="match_parent" android:layout_height="wrap_content"/><Button android:id="@+id/btnPower" android:text="POWER" android:layout_width="match_parent" android:layout_height="80dp" android:layout_marginTop="24dp"/><Button android:id="@+id/btnS1" android:text="SPEED 1-5" android:layout_width="match_parent" android:layout_height="60dp" android:layout_marginTop="16dp"/></LinearLayout>
          L
          cat > app/src/main/java/com/bldcremote/MainActivity.kt <<'K'
          package com.bldcremote
          import android.hardware.ConsumerIrManager
          import android.os.Bundle
          import android.widget.Button
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
            lateinit var ir: ConsumerIrManager
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              setContentView(R.layout.activity_main)
              ir = getSystemService(CONSUMER_IR_SERVICE) as ConsumerIrManager
              findViewById<Button>(R.id.btnPower).setOnClickListener{send()}
              findViewById<Button>(R.id.btnS1).setOnClickListener{send()}
            }
            fun send(){
              val p=intArrayOf(9000,4500,560,560,560,1690,560,560,560,560,560,1690,560,560,560,1690,560,560,560,560,560,560,560,1690,560,1690,560,1690,560,1690,560,1690,560,1690,560,1690,560,560,560,560,560,1690,560,560,560,1690,560,1690,560,1690,560,1690,560,560,560,1690,560,1690,560,560,560,560,560,1690,560,560,560,560)
              try{ir.transmit(38000,p)}catch(e:Exception){}
            }
          }
          K
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BLDC-Remote-No-Ads-APK
          path: app/build/outputs/apk/debug/app-debug.apk
