name: Build BLDC APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build App
        run: |
          mkdir -p app/src/main/java/com/bldcremote
          mkdir -p app/src/main/res/layout
          mkdir -p gradle/wrapper
          echo "include ':app'" > settings.gradle
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          printf "buildscript{dependencies{classpath 'com.android.tools.build:grad
