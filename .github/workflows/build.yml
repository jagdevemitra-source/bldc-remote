name: Build BLDC APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          rm -rf app build.gradle gradle
          mkdir -p app/src/main/java/com/bldcremote
          mkdir -p app/src/main/res/layout

          echo "include ':app'" > settings.gradle

          cat > build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'
              }
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.bldcremote'
              compileSdk 34
              defaultConfig { applicationId "com.bldcremote"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.12.0"
              implementation "androidx.appcompat:appcompat:1.6.1"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.TRANSMIT_IR" android:required="false"/><application android:label="BLDC Remote" android:theme="@android:style/Theme.Black.NoTitleBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:layout_width="match_parent" android:layout_height="match_parent" android:padding="20dp" android:background="#000"><TextView android:text="BLDC Remote - No Ads" android:textColor="#FFF" android:gravity="center" android:layout_width="match_parent" android:layout_height="wrap_content"/><Button android:id="@+id/btnPower" android:text="POWER" android:layout_width="match_parent" android:layout_height="80dp" android:layout_marginTop="24dp"/><Button android:id="@+id/btnS1" android:text="SPEED 1-5" android:layout_width="match_parent" android:layout_height="60dp" android:layout_marginTop="16dp"/></LinearLayout>
          EOF

          cat > app/src/main/java/com/bldcremote/MainActivity.kt <<'EOF'
          package com.bldcremote
          import android.hardware.ConsumerIrManager
          import android.os.Bundle
          import android.widget.Button
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
            lateinit var ir: ConsumerIrManager
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              setContentView(R.layout.activity_main)
              ir = getSystemService(CONSUMER_IR_SERVICE) as ConsumerIrManager
              findViewById<Button>(R.id.btnPower).setOnClickListener{send()}
              findViewById<Button>(R.id.btnS1).setOnClickListener{send()}
            }
            fun send(){
              val p=intArrayOf(9000,4500,560,560,560,1690,560,560,560,560,560,1690,560,560,560,1690,560,560,560,560,560,560,560,1690,560,1690,560,1690,560,1690,560,1690,560,1690,560,1690,560,560,560,560,560,1690,560,560,560,1690,560,1690,560,1690,560,1690,560,560,560,1690,560,1690,560,560,560,560,560,1690,560,560,560,560)
              try{ir.transmit(38000,p)}catch(e:Exception){}
            }
          }
          EOF

          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
         ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5
         ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLDC-Remote-No-Ads-APK
          path: app/build/outputs/apk/debug/app-debug.apk
