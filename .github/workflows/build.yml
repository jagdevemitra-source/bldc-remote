name: Build BLDC APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create Project Files
        run: |
          mkdir -p app/src/main/java/com/bldcremote
          mkdir -p app/src/main/res/layout
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript{dependencies{classpath 'com.android.tools.build:gradle:8.2.0'}}
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
           namespace 'com.bldcremote'
           compileSdk 34
           defaultConfig { applicationId "com.bldcremote"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }
          }
          dependencies { implementation "androidx.core:core-ktx:1.12.0"; implementation "androidx.appcompat:appcompat:1.6.1" }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.TRANSMIT_IR"/>
              <application android:allowBackup="true" android:label="BLDC Remote No Ads" android:theme="@android:style/Theme.Black.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:layout_width="match_parent" android:layout_height="match_parent" android:padding="16dp" android:background="#000000">
              <TextView android:text="BLDC Universal Remote - No Ads" android:textColor="#FFFFFF" android:textSize="18sp" android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="center"/>
              <Button android:id="@+id/btnPower" android:text="POWER" android:layout_width="match_parent" android:layout_height="80dp" android:layout_marginTop="20dp" android:backgroundTint="#D32F2F"/>
              <LinearLayout android:orientation="horizontal" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="20dp">
                  <Button android:id="@+id/btnS1" android:text="1" android:layout_weight="1" android:layout_width="0dp" android:layout_height="60dp"/><Button android:id="@+id/btnS2" android:text="2" android:layout_weight="1" android:layout_width="0dp" android:layout_height="60dp"/><Button android:id="@+id/btnS3" android:text="3" android:layout_weight="1" android:layout_width="0dp" android:layout_height="60dp"/><Button android:id="@+id/btnS
