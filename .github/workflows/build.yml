name: Build BLDC APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Create Project Files
        run: |
          rm -rf app build.gradle settings.gradle gradle gradlew
          mkdir -p app/src/main/java/com/bldcremote
          mkdir -p app/src/main/res/layout
          echo "include ':app'" > settings.gradle
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.4'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10' } } allprojects { repositories { google(); mavenCentral() } }" > build.gradle
          echo "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' } android { namespace 'com.bldcremote'; compileSdk 34; defaultConfig { applicationId 'com.bldcremote'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' } } dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1' }" > app/build.gradle
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.TRANSMIT_IR" /><application android:label="BLDC Remote" android:theme="@android:style/Theme.Black.NoTitleBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></
